---
parameters:
  - name: imageName

  - name: serviceConnection

  - name: acrName

steps:
  - bash: |
      docker build \
        -t ${{ parameters.imageName }} \
        -f app/dockerfile \
        app
    displayName: Build application container image

  - bash: |
      curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
        | sudo sh -s -- -b /usr/local/bin v0.75.0

      trivy --version
    displayName: Install Trivy

  - bash: |
      trivy image \
        --severity HIGH,CRITICAL \
        --ignore-unfixed \
        --exit-code 1 \
        ${{ parameters.imageName }}
    displayName: Trivy container vulnerability scan

  - task: AzureCLI@2
    displayName: Push validated image to ACR
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az acr login --name ${{ parameters.acrName }}

        docker push ${{ parameters.imageName }}