trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: windows-latest

variables:
  TF_VAR_location: 'australiaeast'
  TF_VAR_resource_group_name: 'rg-app-aks-network-australiaeast-001'
  TF_VAR_vnet_name: 'vnet-app-aks-australiaeast'
  TF_VAR_vnet_address_space: '["10.10.0.0/16"]'

stages:

- stage: TerraformPlan
  displayName: Terraform CI and Plan

  jobs:
  - job: TerraformPlan
    displayName: Validate and Plan

    steps:
    - checkout: self

    - template: .pipelines/helpers/terraform-installer.yaml
      parameters:
        terraformVersion: 'latest'

    - pwsh: |
        terraform fmt -check -recursive
      displayName: Terraform Format Check

    - template: .pipelines/helpers/terraform-init.yaml
      parameters:
        serviceConnection: 'sc-alz-app-plan'
        backendAzureSubscriptionId: '6dc86c77-8ac3-49aa-9753-027ac2ed3154'
        backendAzureResourceGroupName: 'rg-alz-mgmt-state-australiaeast-001'
        backendAzureStorageAccountName: 'stoalzmgmaus001vdrb'
        backendAzureStorageAccountContainerName: 'mgmt-tfstate'
        backendAzureStorageAccountContainerKeyName: 'azure-application-landing-zone-aks.tfstate'
        root_module_folder_relative_path: '.'

    - pwsh: |
        terraform validate
      displayName: Terraform Validate

    - template: .pipelines/helpers/checkov-scan.yaml

    - template: .pipelines/helpers/terraform-plan.yaml
      parameters:
        terraform_action: 'apply'
        serviceConnection: 'sc-alz-app-plan'
        root_module_folder_relative_path: '.'

    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Plan
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/tfplan'
        artifact: 'terraform-plan'


- stage: ContainerSecurity
  displayName: Container Build and Security Scan
  dependsOn: TerraformPlan

  jobs:
  - job: BuildAndScan
    displayName: Build and scan application image

    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self

    - template: .pipelines/helpers/trivy-scan.yaml
      parameters:
        imageName: 'acrappae001rkb.azurecr.io/aks-platform-demo:$(Build.BuildId)'
        serviceConnection: 'sc-alz-app-apply'
        acrName: 'acrappae001rkb'


- stage: DeployToAKS
  displayName: Deploy Validated Image to AKS
  dependsOn: ContainerSecurity

  jobs:
  - job: Deploy
    displayName: Deploy application to private AKS

    pool:
      vmImage: ubuntu-latest

    steps:
    - task: AzureCLI@2
      displayName: Start AKS if stopped
      inputs:
        azureSubscription: 'sc-alz-app-apply'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          RG="rg-app-aks-network-australiaeast-001"
          CLUSTER="aks-app-australiaeast-001"

          STATE=$(az aks show \
            --resource-group "$RG" \
            --name "$CLUSTER" \
            --query powerState.code \
            -o tsv)

          echo "Current AKS power state: $STATE"

          if [ "$STATE" = "Stopped" ]; then
            echo "Starting AKS cluster..."
            az aks start \
              --resource-group "$RG" \
              --name "$CLUSTER"
          else
            echo "AKS is already running."
          fi

    - task: AzureCLI@2
      displayName: Deploy validated image to AKS
      inputs:
        azureSubscription: 'sc-alz-app-apply'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          RG="rg-app-aks-network-australiaeast-001"
          CLUSTER="aks-app-australiaeast-001"
          IMAGE="acrappae001rkb.azurecr.io/aks-platform-demo:$(Build.BuildId)"

          az aks command invoke \
            --resource-group "$RG" \
            --name "$CLUSTER" \
            --command "kubectl set image deployment/aks-platform-demo aks-platform-demo=$IMAGE"

          az aks command invoke \
            --resource-group "$RG" \
            --name "$CLUSTER" \
            --command "kubectl rollout status deployment/aks-platform-demo --timeout=180s"

          az aks command invoke \
            --resource-group "$RG" \
            --name "$CLUSTER" \
            --command "kubectl get pods -l app=aks-platform-demo -o wide"